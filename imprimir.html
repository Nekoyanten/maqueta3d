<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja para imprimir · Maqueta3d</title>
<script src="qrcode.js"></script>
<style>
  @page{size:A4;margin:12mm}
  body{font-family:Arial,sans-serif;margin:0;padding:16px;color:#1f3864;text-align:center}
  h1{margin:0 0 4px;font-size:30px} .sub{font-size:18px;margin-bottom:14px;color:#333}
  .fila{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .caja{border:3px solid #1f3864;border-radius:14px;padding:14px;width:300px}
  .caja h2{margin:0 0 8px;font-size:20px} .caja p{margin:8px 0 0;font-size:15px;color:#333}
  #qr img{width:260px;height:260px}
  .marc img{width:260px;height:260px}
  .url{font-size:11px;color:#666;word-break:break-all;margin-top:10px}
  button{font:bold 18px Arial;padding:14px 26px;border:0;border-radius:28px;background:#0A4DBF;color:#fff;margin:12px 0}
  @media print{button{display:none}}
</style>
</head>
<body>
<h1>Maqueta3d en realidad aumentada</h1>
<div class="sub">Escanea el QR, permite la cámara y apunta al marcador</div>
<div class="fila">
  <div class="caja"><h2>1. Escanea el QR</h2><div id="qr"></div><p>Con la cámara de tu celular</p></div>
  <div class="caja marc"><h2>2. Apunta aquí</h2><img src="marcador.png" alt="Marcador"><p>La maqueta aparece sobre este cuadro. Gírala con un dedo y acércala con dos.</p></div>
</div>
<div class="url" id="url"></div>
<button onclick="window.print()">Imprimir esta hoja</button>
<script>
  const u=new URL('ar.html',location.href).href;
  const q=qrcode(0,'M'); q.addData(u); q.make();
  document.getElementById('qr').innerHTML=q.createImgTag(8,0);
  document.getElementById('url').textContent=u;
</script>
</body>
</html>
